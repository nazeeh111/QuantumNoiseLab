[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-noise-lab"
version = "0.1.0"
description = "Reproducible driven-qubit and decoherence experiments with analytical validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "nazeeh111"}]
dependencies = ["qutip>=5.2,<6", "numpy>=2.1,<3", "scipy>=1.14,<2", "matplotlib>=3.9,<4"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "build>=1,<2"]

[project.scripts]
quantum-noise-lab = "quantumnoiselab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quantumnoiselab = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
